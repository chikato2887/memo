<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session Explorer — Desktop prototype</title>
<style>
:root{color-scheme:dark;--bg:#10141b;--panel:#171d27;--line:#2d3746;--text:#e0e6f0;--muted:#98a6ba;--blue:#94b5e9;--red:#f0a29a;--green:#8dd4b2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.6 system-ui,-apple-system,sans-serif}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;background:#131923}h1{font-size:19px;margin:0;letter-spacing:-.4px}h2{font-size:22px;margin:0 0 4px}h3{font-size:14px;margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.mono,code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-variant-numeric:tabular-nums}#app{display:grid;grid-template-columns:248px minmax(0,1fr);height:calc(100dvh - 64px)}aside{background:#141a23;border-right:1px solid var(--line);padding:20px 14px;overflow:auto}.session{display:block;text-align:left;width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:12px;margin:6px 0}.session.on,.agent.on{background:#223149;border-color:#58749d}.session:hover,.agent:hover{border-color:#58749d}main{overflow:auto;padding:24px 28px 40px;min-width:0}.metrics{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;margin:18px 0}.metric{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px;min-width:0}.value{font-size:23px;font-weight:650;letter-spacing:-.6px;font-variant-numeric:tabular-nums}.red{color:var(--red)}.green{color:var(--green)}.panel{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:16px;margin:14px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.lane{display:grid;grid-template-columns:105px minmax(0,1fr);gap:12px;align-items:center;margin:8px 0}.track{position:relative;height:25px;background:#202a38;border-radius:4px;overflow:hidden}.segment{position:absolute;top:4px;height:17px;border:0;border-radius:3px;min-width:2px}.axis{display:flex;justify-content:space-between;margin-left:117px;color:var(--muted);font-size:11px}.workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}.agent{width:100%;text-align:left;background:#192230;border:1px solid var(--line);border-radius:7px;padding:12px;margin:0 0 9px}.agent .value{font-size:16px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.filters{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.filter{border:1px solid var(--line);background:#192230;border-radius:5px;padding:5px 10px}.filter.on{background:#304565;border-color:#7895c2}.event{display:grid;grid-template-columns:76px 12px minmax(0,1fr) 78px;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:start}.event:last-child{border-bottom:0}.event .dot{margin-top:7px}.kind{font-size:10px;letter-spacing:.6px;font-weight:650}.tag{display:inline-block;background:#493139;color:var(--red);padding:2px 7px;border-radius:4px;margin:5px 5px 0 0;font-size:11px}.tag.rework{background:#403725;color:#e6c78f}.tag.approval{background:#243b34;color:var(--green)}code,pre{white-space:pre-wrap;overflow-wrap:anywhere}code{display:block;background:#101720;padding:8px 10px;border-radius:5px;margin-top:6px;color:#b8cce6}pre{font-size:12px;background:#101720;padding:10px;border-radius:5px;margin:5px 0}summary{cursor:pointer;color:var(--blue);font-size:12px;margin-top:5px}.link{background:none;border:0;color:var(--blue);padding:0;text-align:left}.duration{text-align:right;font-weight:600}.sticky{position:sticky;top:0;background:var(--panel);z-index:1;padding-bottom:4px}.note{font-size:11px;color:var(--muted);margin-top:16px}@media(min-width:1500px){.workspace{grid-template-columns:330px minmax(0,1fr)}}@media(max-width:1200px){.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.workspace{grid-template-columns:245px minmax(0,1fr)}main{padding:18px}#app{grid-template-columns:210px minmax(0,1fr)}}@media(max-width:800px){#app{height:auto;display:block}aside{border-right:0;border-bottom:1px solid var(--line)}.workspace{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.event{grid-template-columns:56px 8px minmax(0,1fr) 50px}header{padding:0 14px}main{padding:12px}}
</style></head><body><header><div><h1>Session Explorer</h1><span class="muted">Local agent history / Desktop prototype</span></div><span class="muted">DEMO · Synthetic data · No external requests</span></header><div id="app"><aside id="sessions"></aside><main id="main"></main></div>
<script>
"use strict";
const sessions=[{"id":"042","name":"Streaming APIの設計・実装","time":"09:10","first":"Fail","outcome":"Pass","total":151,"agents":[{"id":"main","name":"Main","parent":null,"model":"GPT-5.6","effort":"high","tokens":48200,"cost":0.24,"start":0,"end":151,"task":"設計・実装・検証"},{"id":"a1","name":"Explorer","parent":"main","model":"GPT-5.4-mini","effort":"medium","tokens":21400,"cost":0.03,"start":16,"end":58,"task":"既存Providerの構造を調査"},{"id":"a2","name":"Reviewer","parent":"main","model":"GPT-5.6","effort":"high","tokens":32800,"cost":0.17,"start":18,"end":76,"task":"既存契約への影響を調査"}],"events":[["main",0,null,"User","既存インターフェースを維持してProviderを追加して。"],["main",0,16,"Agent","調査方針を検討"],["main",16,0.2,"Spawn","Explorerを起動",null,"既存Providerの構造を調査","a1"],["main",18,0.2,"Spawn","Reviewerを起動",null,"既存契約への影響を調査","a2"],["main",19,6,"Tool","作業ツリーを確認","git status --short","Working tree clean"],["main",25,51,"Wait","サブエージェント完了待ち"],["main",76,8,"Assistant","新しい共通Adapter層を提案"],["main",84,18,"Wait","ユーザー入力待ち"],["main",102,null,"User","いや、既存インターフェースをそのまま使ってよ。",null,null,null,["correction","repeat"]],["main",102,15,"Agent","設計案を修正",null,null,null,["rework"]],["main",117,8,"Tool","既存構造を利用して実装","apply_patch src/providers/new-provider.ts","Patch applied"],["main",125,21,"Tool","回帰テストを実行","npm test -- providers","Tests: 38 passed"],["main",146,5,"Assistant","既存インターフェースを維持して実装完了"],["main",151,null,"User","これでOK。",null,null,null,["approval"]],["a1",16,8,"Agent","調査対象を特定"],["a1",24,0.4,"Tool","Provider実装を検索","rg -n 'class .*Provider' src/","src/providers/openai.ts:18\nsrc/providers/vertex.ts:22"],["a1",24.4,0.2,"Tool","既存変換処理を読み込み","cat src/providers/openai.ts","export class OpenAIProvider { /* sample */ }"],["a1",24.6,28.4,"Agent","既存インターフェースと変換処理を整理"],["a1",53,5,"Assistant","既存の変換インターフェースを再利用可能と報告"],["a2",18,11,"Agent","外部契約の調査方針を検討"],["a2",29,0.6,"Tool","呼び出し元を検索","rg -n 'StreamEvent' src/ test/","src/api/stream.ts\nsrc/client/parser.ts\ntest/stream.test.ts"],["a2",29.6,14.4,"Agent","イベント形式と互換性を調査"],["a2",44,27,"Tool","既存契約テストを実行","npm test -- stream.test.ts","Tests: 24 passed"],["a2",71,5,"Assistant","既存イベント形式を維持すれば互換性を確保可能と報告"]]},{"id":"043","name":"エラー処理の統一","time":"13:00","first":"Pass","outcome":"Pass","total":38.4,"agents":[{"id":"main","name":"Main","parent":null,"model":"GPT-5.6","effort":"medium","tokens":12000,"cost":0.06,"start":0,"end":38.4,"task":"既存パターンへの統一"}],"events":[["main",0,null,"User","既存パターンに合わせてエラー処理を統一して。"],["main",0,8,"Agent","既存パターンを調査"],["main",8,0.4,"Tool","共通処理を検索","rg -n 'handleError' src/","src/shared/errors.ts:12"],["main",8.4,6,"Tool","実装を変更","apply_patch src/service.ts","Patch applied"],["main",14.4,9,"Tool","テストを実行","npm test -- errors","Tests: 12 passed"],["main",23.4,5,"Assistant","実装完了・テスト成功"],["main",28.4,10,"Wait","ユーザー入力待ち"],["main",38.4,null,"User","これでOK。",null,null,null,["approval"]]]},{"id":"044","name":"外部API変更レビュー","time":"15:20","first":"Unknown","outcome":"Unknown","total":55,"agents":[{"id":"main","name":"Main","parent":null,"model":"GPT-5.6","effort":"high","tokens":24000,"cost":0.12,"start":0,"end":55,"task":"外部契約への影響調査"}],"events":[["main",0,null,"User","外部契約への影響を調査して。"],["main",0,0.2,"Tool","差分を取得","git diff main...HEAD","Sample diff"],["main",0.2,26.8,"Agent","変更内容を分析"],["main",27,0.6,"Tool","呼び出し元を探索","rg -n 'ExternalApiClient' src/","src/client.ts:12"],["main",27.6,19.4,"Agent","影響範囲を検討"],["main",47,8,"Assistant","レビュー結果を提示。承認未確認。"]]}].map(s=>({...s,events:s.events.map((e,i)=>({id:s.id+"-E"+String(i+1).padStart(2,"0"),agent_id:e[0],elapsed_seconds:e[1],duration_seconds:e[2],duration_source:"synthetic",type:e[3],summary:e[4],command:e[5]??null,result:e[6]??null,child_agent_id:e[7]??null,annotations:e[8]??[]}))}));
const colors={main:"#83a6d8",a1:"#b19ce5",a2:"#70b7bf",User:"#e4b47e",Agent:"#b19ce5",Tool:"#83a6d8",Assistant:"#8dd4b2",Wait:"#8290a4",Spawn:"#b19ce5"};
const labels={correction:"修正介入 +1",repeat:"繰り返し指摘 +1",rework:"推定手戻り",approval:"承認"};
let sessionIndex=0,agentId="main",filter="all";
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(Math.floor(n%60)).padStart(2,"0");
const dur=n=>n==null?"—":Number(n.toFixed(1))+"s";
const count=(s,t)=>s.events.filter(e=>e.annotations.includes(t)).length;
const sum=(s,k)=>s.agents.reduce((n,a)=>n+a[k],0);
const status=v=>v==="Pass"?"green":v==="Fail"?"red":"muted";
function render(){
const s=sessions[sessionIndex],current=s.agents.find(a=>a.id===agentId);
document.getElementById("sessions").innerHTML='<h3>Sessions <span class="muted"> / Nov 26</span></h3>'+sessions.map((x,i)=>'<button class="session '+(i===sessionIndex?'on':'')+'" data-session="'+i+'"><strong>'+esc(x.name)+'</strong><div class="muted">'+x.time+' · #'+x.id+' · '+fmt(x.total)+'</div><div class="'+(count(x,"correction")?'red':'muted')+'">修正介入 '+count(x,"correction")+'回</div></button>').join('');
const metrics=[["総経過時間",fmt(s.total),""],["推定APIコスト","$"+sum(s,"cost").toFixed(2),""],["総トークン",(sum(s,"tokens")/1000).toFixed(1)+"K",""],["修正介入",count(s,"correction")+"回",count(s,"correction")?"red":""],["繰り返し指摘",count(s,"repeat")+"回",count(s,"repeat")?"red":""],["推定手戻り",dur(s.events.filter(e=>e.annotations.includes("rework")).reduce((n,e)=>n+(e.duration_seconds??0),0)),""],["初回承認",s.first,status(s.first)],["最終結果",s.outcome,status(s.outcome)]];
const bar=(start,end,color,id)=>'<button aria-label="'+esc(id+" timeline")+'" title="'+esc(id+" "+fmt(start)+"–"+fmt(end))+'" class="segment" data-agent="'+id+'" style="left:'+start/s.total*100+'%;width:'+(end-start)/s.total*100+'%;background:'+color+'"></button>';
const lanes=s.agents.map(a=>'<div class="lane"><button class="link" data-agent="'+a.id+'">'+esc(a.name)+'</button><div class="track">'+(a.id==="main"?s.events.filter(e=>e.agent_id===a.id&&e.duration_seconds>0).map(e=>bar(e.elapsed_seconds,e.elapsed_seconds+e.duration_seconds,e.type==="Wait"?"#485568":colors.main,a.id)).join(""):bar(a.start,a.end,colors[a.id]||colors.a1,a.id))+'</div></div>').join("");
const visible=s.events.filter(e=>(agentId==="all"||e.agent_id===agentId)&&(filter==="all"||filter==="tools"&&e.type==="Tool"||filter==="correction"&&e.annotations.includes("correction")||filter==="rework"&&e.annotations.includes("rework"))).sort((a,b)=>a.elapsed_seconds-b.elapsed_seconds);
document.getElementById("main").innerHTML='<div class="row"><div><h2>'+esc(s.name)+'</h2><div class="muted">Session #'+s.id+' · '+s.time+' · '+(s.agents.length-1)+' subagents</div></div><button class="filter" data-export>JSON を保存</button></div><div class="metrics">'+metrics.map(m=>'<div class="metric"><div class="muted">'+m[0]+'</div><div class="value '+m[2]+'">'+m[1]+'</div></div>').join("")+'</div><section class="panel"><div class="row"><h3>Execution timeline</h3><span class="muted">共通時間軸 · 灰色は待機</span></div>'+lanes+'<div class="axis">'+[0,.25,.5,.75,1].map(v=>'<span>'+fmt(s.total*v)+'</span>').join("")+'</div></section><div class="workspace"><section class="panel"><h3>Agents</h3><button class="agent '+(agentId==="all"?"on":"")+'" data-agent="all">全エージェントの履歴</button>'+s.agents.map(a=>'<button class="agent '+(agentId===a.id?"on":"")+'" data-agent="'+a.id+'"><div class="row"><strong><i class="dot" style="background:'+colors[a.id]+'"></i>'+esc(a.name)+'</strong><strong class="mono">$'+a.cost.toFixed(2)+'</strong></div><div>'+esc(a.task)+'</div><div class="muted">'+esc(a.model)+' · '+esc(a.effort)+'</div><div class="row muted"><span>'+dur(a.end-a.start)+'</span><span>'+(a.tokens/1000).toFixed(1)+'K tokens</span></div><div class="track" style="height:5px;margin-top:7px"><div style="height:100%;width:'+a.cost/sum(s,"cost")*100+'%;background:'+colors[a.id]+'"></div></div></button>').join("")+'<p class="note">コストは架空のAPI換算値。親子の経過時間は重複するため単純加算しない。</p></section><section class="panel"><div class="sticky"><div class="row"><h3>'+esc(current?.name??"All agents")+' — 行動履歴</h3><span class="muted">'+visible.length+' events</span></div><div class="filters">'+[["all","すべて"],["tools","実行コマンド"],["correction","修正介入"],["rework","手戻り"]].map(f=>'<button class="filter '+(filter===f[0]?"on":"")+'" data-filter="'+f[0]+'">'+f[1]+'</button>').join("")+'</div><div class="row muted"><span>経過時間 / 行動内容</span><span>所要時間</span></div></div>'+visible.map(e=>'<article class="event"><span class="mono muted">+'+fmt(e.elapsed_seconds)+'</span><i class="dot" style="background:'+colors[e.type]+'"></i><div><div class="kind" style="color:'+colors[e.type]+'">'+esc(e.type.toUpperCase())+' · '+esc(e.id)+(agentId==="all"?' · '+esc(e.agent_id):'')+'</div><div>'+esc(e.summary)+'</div>'+(e.command?'<code>$ '+esc(e.command)+'</code>':'')+(e.result?'<details><summary>実行結果 / 委譲指示</summary><pre>'+esc(e.result)+'</pre></details>':'')+(e.child_agent_id?'<button class="link" data-agent="'+e.child_agent_id+'">↳ 子エージェントの履歴を見る</button>':'')+e.annotations.map(t=>'<span class="tag '+t+'">'+labels[t]+(t==="rework"?' +'+dur(e.duration_seconds):'')+'</span>').join("")+'<details><summary>構造化データ</summary><pre>'+esc(JSON.stringify(e,null,2))+'</pre></details></div><span class="duration mono">'+dur(e.duration_seconds)+'</span></article>').join("")+(visible.length?"":'<p class="muted">該当イベントなし</p>')+'</section></div><p class="note">すべて架空のデータ。原因分析・横断集計なし。実ログ接続、正確な時刻・モデル・トークン取得、評価ラベル付与は未実装。Unknownは承認未確認。</p>';
}
document.getElementById("app").addEventListener("click",ev=>{const b=ev.target.closest("button");if(!b)return;if(b.hasAttribute("data-session")){sessionIndex=Number(b.dataset.session);agentId="main";filter="all";render();document.getElementById("main").scrollTop=0}else if(b.hasAttribute("data-agent")){agentId=b.dataset.agent;filter="all";render()}else if(b.hasAttribute("data-filter")){filter=b.dataset.filter;render()}else if(b.hasAttribute("data-export")){const s=sessions[sessionIndex];const blob=new Blob([JSON.stringify({...s,metrics:{elapsed_seconds:s.total,estimated_api_cost:sum(s,"cost"),total_tokens:sum(s,"tokens"),corrective_interventions:count(s,"correction"),repeated_corrections:count(s,"repeat"),estimated_rework_seconds:s.events.filter(e=>e.annotations.includes("rework")).reduce((n,e)=>n+(e.duration_seconds??0),0),first_pass_acceptance:s.first,task_outcome:s.outcome}},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="session-"+s.id+".json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}});
render();
</script></body></html>
