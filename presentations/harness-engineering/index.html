分に信頼できないこと。","45秒｜人間を取り除くのではなく、検証・フィードバック・完了判定を仕組みに移す。判断不能時は人間に戻す。","30秒｜Write code = Context / Skills / Architecture、Run the code = Tools / Execution Environment、Find issues = Verification / Eval。反復は Feedback / Loop Control。図は提供された動画40:00付近をもとに再構成。","60秒｜今回の用語整理。コードベース・制約・検証環境もハーネス。検証手段を提供することと、いつ実行してどう反復・停止するかを区別する。","90秒｜API設計・アーキテクチャで不正な選択を減らす。Lintや型で強制し、実行時検証を重ね、文章は判断が必要なものに限定する。逆ピラミッドは講演の概念を再構成。レビューの価値を一度限りで終わらせない。","60秒｜古くなったルールやADR、重複・矛盾が判断を増やす。ADRそのものを否定するのではなく、機械的に保証できることを仕組みに移し、背景・意図を残す。削除も改善。","45秒｜対談では多くの作業がGardeningであると説明されている。左右の分類は私見であり、実際のPR内訳ではない。新機能の設計が完全自動化されていないという具体発言は未確認のため断定しない。","60秒｜要求と検証可能性の2軸。配置は概念例。回帰テスト、API契約、実行環境などの投資で自律化できるタスクを増やす。要求の明確化には人間の判断も必要。","45秒｜所有するリポジトリでは構造的に防ぐ。横断的レビューなど事前整備が難しい場合には探索・検証能力に投資する。","45秒｜Skills数ではなく成果で評価する。誤った完了判定を別に測る。グラフは概念図であり実測ではない。判断不能なら停止・エスカレーション。","75秒｜今後の成果の品質を担保する仕組みに時間を使う。ハーネス改善の合意形成コストも将来の便益とリスクを踏まえて判断する。","改善エージェントが実行履歴・介入を分析し、Lint・Skills・Contextなどを変更。再実行と未使用評価タスクで回帰検証し、必要な承認を経て採用。Meta-Harnessの発想に近い。","今回の整理。Graphは複数のエージェントやループの依存関係・協調を設計する。","同じ代表タスク群と未使用の評価タスクで改善前後を比較する。"],titles=["なぜ我々は、まだ自動化できないのか。","信頼できる開発ループ","エンジニアリングの基本ループ","Harness Engineering / Loop Engineering","どこに投資すべきか？","コンテキストは資産にも負債にもなる","月間数千PRの実態","自動化可能な領域を広げる","リポジトリに応じた投資戦略","良いハーネス・良いループとは？","自動化そのものより、自動化できる状態を作る。","自動化を改善する自動化","Harness / Loop / Graph Engineering","ハーネスの評価指標"];let i=0;const $=id=>document.getElementById(id);function toggle(id){$(id).classList.toggle('open')}function show(n){i=Math.max(0,Math.min(images.length-1,n));$('slide').src=images[i];$('slide').alt=titles[i];$('count').textContent=(i+1)+' / '+images.length;$('notes').textContent=notes[i]||'';location.hash=i+1}function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})}titles.forEach((t,j)=>{let b=document.createElement('button');b.textContent=(j+1)+' — '+t;b.onclick=()=>{show(j);toggle('overview')};$('overview').append(b)});document.addEventListener('keydown',e=>{if(['Arro
